<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex,follow" />
<title>ページが見つかりません｜エステサロン【CALDINA】</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="manifest" href="/site.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<style type="text/css">
@import url('https://fonts.googleapis.com/css?family=Noto+Sans+JP:400,700|Noto+Serif+JP:400,700&display=swap&subset=japanese');

/* このページはどの階層で返されるか分からないので、
   参照は全て「/」始まりにし、見た目もここだけで完結させてある。
   使っている数と色は、サイト本体と同じものだけ。
     余白 20/30/40/50/100/150 ／ 級数 28/22/16/13/12 ／ 行送り 1.7
     色 #A4896A #614E3B #6E5C48 #AE967A #EFEAE6
     1px＝仕切る（押せない） / 2px＝押せる */

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
	background: #ffffff;
	color: #614E3B;
	font-family: 'Noto Serif JP', serif;
	line-height: 1.7;
	-webkit-text-size-adjust: 100%;
}

.wrap {
	max-width: 640px;
	margin: 0 auto;
	padding: 100px 20px;
	text-align: center;
}

/* ロゴ */
.mark { display: inline-block; }
.mark img { display: block; width: 260px; height: auto; }

/* 見出し。数字は主役ではないので、文章より小さく、静かに置く */
.code {
	display: block;
	margin: 50px 0 0;
	font-family: 'Noto Sans JP', sans-serif;
	font-size: 12px;
	letter-spacing: .3em;
	color: #6E5C48;
}
h1 {
	margin: 20px 0 0;
	font-size: 28px;
	font-weight: 400;
	line-height: 1.5;
	letter-spacing: .04em;
}
.lead {
	margin: 30px 0 0;
	font-family: 'Noto Sans JP', sans-serif;
	font-size: 13px;
	color: #6E5C48;
}

/* 主導線。2px の金枠＝押せる、はサイト本体と同じ符号 */
.home {
	display: inline-block;
	min-width: 300px;
	margin: 50px 0 0;
	padding: 15px 30px;
	border: 2px solid #A4896A;
	color: #614E3B;
	font-size: 16px;
	line-height: 20px;
	letter-spacing: .08em;
	text-decoration: none;
	transition: background-color 200ms cubic-bezier(.1,.45,.15,1),
	            color 200ms cubic-bezier(.1,.45,.15,1);
}
.home:hover,
.home:focus { background: #A4896A; color: #ffffff; }

/* 副導線。1本の帯をヘアラインで割る、という本体と同じ組み方 */
.ways {
	display: flex;
	margin: 50px 0 0;
	border-top: 1px solid #AE967A;
	border-bottom: 1px solid #AE967A;
	list-style: none;
}
.ways > li { flex: 1 1 50%; border-left: 1px solid #D9CCBD; }
.ways > li:first-child { border-left: 0; }
.ways a {
	display: block;
	padding: 20px 10px;
	color: #614E3B;
	text-decoration: none;
	transition: background-color 200ms cubic-bezier(.1,.45,.15,1);
}
.ways a:hover,
.ways a:focus { background: #EFEAE6; }
.ways .t { display: block; font-size: 16px; letter-spacing: .06em; }
.ways .s {
	display: block;
	margin-top: 5px;
	font-family: 'Noto Sans JP', sans-serif;
	font-size: 12px;
	letter-spacing: .06em;
	color: #6E5C48;
}

.hours {
	margin: 40px 0 0;
	font-family: 'Noto Sans JP', sans-serif;
	font-size: 12px;
	line-height: 2;
	color: #6E5C48;
}

@media screen and (max-width: 640px) {
	.wrap { padding: 50px 20px; }
	.mark img { width: 220px; }
	.code { margin-top: 40px; }
	h1 { font-size: 22px; }
	.home { display: block; min-width: 0; width: 100%; margin-top: 40px; font-size: 15px; }
	.ways { margin-top: 40px; }
	.ways .t { font-size: 15px; }
}

@media (prefers-reduced-motion: reduce) {
	* { transition-duration: .01ms !important; }
}
</style>
</head>
<body>

<div class="wrap">

	<a class="mark" href="/index.html">
		<img src="/assets/logo.png" width="230" height="188" alt="CALDINA" />
	</a>

	<span class="code">404</span>
	<h1>お探しのページが<br />見つかりませんでした</h1>
	<p class="lead">アドレスが変わったか、削除された可能性があります。</p>

	<a class="home" href="/index.html">トップページへ戻る</a>

	<ul class="ways">
		<li>
			<a href="tel:{{電話番号ハイフンなし}}">
				<span class="t">お電話</span>
				<span class="s">{{電話番号}}</span>
			</a>
		</li>
		<li>
			<a href="/singlefolder/reservation.html">
				<span class="t">Web予約</span>
				<span class="s">24時間受付</span>
			</a>
		</li>
	</ul>

	<p class="hours">
		営業時間 10:00〜　※予約制<br />
		定休日　月曜日・<span class="lr-nb">第１第３日曜日</span>
	</p>

</div>

</body>
</html>
